<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Definitions -->
  <defs>
    <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Quantum orbital rings -->
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7" transform="rotate(0 100 100)"/>
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7" transform="rotate(60 100 100)"/>
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7" transform="rotate(120 100 100)"/>
  
  <!-- Central quantum core -->
  <circle cx="100" cy="100" r="12" fill="url(#coreGradient)" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Matrix elements (small squares representing data points) -->
  <rect x="60" y="60" width="8" height="8" fill="#34d399" opacity="0.8" rx="1"/>
  <rect x="132" y="60" width="8" height="8" fill="#34d399" opacity="0.8" rx="1"/>
  <rect x="60" y="132" width="8" height="8" fill="#34d399" opacity="0.8" rx="1"/>
  <rect x="132" y="132" width="8" height="8" fill="#34d399" opacity="0.8" rx="1"/>
  
  <!-- Additional quantum state indicators -->
  <rect x="76" y="45" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="118" y="45" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="76" y="149" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="118" y="149" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="45" y="76" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="149" y="76" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="45" y="118" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  <rect x="149" y="118" width="6" height="6" fill="#a78bfa" opacity="0.6" rx="1"/>
  
  <!-- Quantum entanglement connections -->
  <path d="M 60 100 Q 80 80 100 100 Q 120 120 140 100" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6"/>
  <path d="M 100 60 Q 120 80 100 100 Q 80 120 100 140" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Main text "qml" -->
  <text x="100" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" filter="url(#glow)">qml</text>
  
  <!-- Subtitle -->
  <text x="100" y="130" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="8" font-weight="normal">quantum machine learning</text>
  
  <!-- R integration indicator -->
  <circle cx="170" cy="30" r="15" fill="#276dc3" stroke="#1e40af" stroke-width="1"/>
  <text x="170" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">R</text>
  
  <!-- Polar coordinate indicator (r, φ) -->
  <path d="M 30 30 A 15 15 0 0 1 45 45" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <circle cx="30" cy="30" r="2" fill="#fbbf24" opacity="0.8"/>
  <text x="50" y="32" fill="#fbbf24" font-family="Arial, sans-serif" font-size="6" opacity="0.6">r,φ</text>
  
  <!-- Binary classification indicator -->
  <circle cx="30" cy="170" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="40" cy="170" r="4" fill="#ef4444" opacity="0.8"/>
  <text x="50" y="173" fill="#94a3b8" font-family="Arial, sans-serif" font-size="6">binary</text>
</svg>
